# Operator-initiated upstream-mirror maintenance for Mike's PUBLIC fork.
#
# This workflow runs ONLY on manual `workflow_dispatch`; it has no schedule.
# Routine upstream freshness is a per-clone concern handled at custom-session
# start by .github/mike-upstream-sync/freshness.mjs (see the session-start
# freshness Agent Note), which is a read-only git check that advances a shared
# stamp only on success and never triggers this workflow. When a human dispatches
# it, this workflow mirrors the upstream default branch onto the fork's `master`
# and opens a single DRAFT pull request into `oh-mike-dsh` for HUMAN review. It
# NEVER merges, force-pushes, deploys, or writes upstream/settings/reviews. All
# policy lives in .github/mike-upstream-sync/sync.mjs (unit-tested).
#
# CI on these PRs is NOT a reliable pass/fail signal. This repository's
# pull_request CI runs on team-only runners (`dsh-ubuntu-24-04-16core` and
# self-hosted pools) that do not exist on a personal fork, so those inherited
# jobs cannot run there and their checks stay missing or pending. Missing or
# pending checks are NOT passes. Review requires MANUAL local validation; the
# repository operator must set up compatible runners if fork CI is ever wanted.
# See the Agent Note 2026-09-09-mike-upstream-review-sync.md.
#
# GITHUB_TOKEN limits (current GitHub behavior, verified against
# https://docs.github.com/actions/using-workflows/triggering-a-workflow):
# a PR opened by GITHUB_TOKEN CAN trigger pull_request workflows, but such runs
# REQUIRE manual approval. Combined with the unavailable runners above, treat
# check status on these PRs as "not run" until a human validates locally. New
# fork Actions may also need to be enabled and allowed to create PRs; the
# repository operator configures that after publication.
#
# KNOWN LIMITATION — writing refs whose diff touches .github/workflows/**:
# GITHUB_TOKEN cannot create or update workflow files, and the `workflows` scope
# is NOT grantable to it by any permissions key. When the upstream head this sync
# mirrors, or the reserved import branch it creates, differs from the fork in any
# .github/workflows/** file, that ref write can be rejected server-side
# ("refusing to allow a GitHub App to create or update workflow ... without
# workflows permission"). Community reports indicate creating a NEW branch and
# updating an EXISTING ref can behave differently, so this is a real, observed
# policy limit rather than a guarantee that every workflow-touching update fails;
# the actual result is confirmed by live dispatch after publication. Either way
# the sync does NOT silently claim success: a rejected write fails loud and needs
# a human (a manual push, or a PAT/GitHub App with `workflows` deliberately
# provisioned by the operator — NEVER auto-copied from the runner token here).
# This automation ships no such credential. See the Agent Note's auth section.
name: mike upstream review sync

on:
  workflow_dispatch:

# One queued run; do not cancel an in-progress mirror/PR operation midway.
concurrency:
  group: mike-upstream-review-sync
  cancel-in-progress: false

# Only the writes this automation needs on the fork: advance the mirror ref and
# open the draft PR. No other scope.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Never run on upstream or any other repository — only Mike's fork. The
    # comparison is case-insensitive because GitHub owner/repo slugs are.
    if: ${{ github.repository == 'MizkoEu/deepseek-harness' || github.repository == 'mizkoeu/deepseek-harness' }}
    runs-on: ubuntu-latest
    steps:
      # Check out the TRUSTED custom integration branch (oh-mike-dsh), NOT the
      # master mirror: the mirror holds upstream code and does NOT contain this
      # automation's .github/mike-upstream-sync/ scripts, so checking it out
      # would either module-not-found or, once the mirror advances, execute
      # upstream-controlled code with the write token. oh-mike-dsh is
      # human-reviewed and owns these scripts. Credentials are not persisted.
      - name: Checkout trusted integration branch
        uses: actions/checkout@v4
        with:
          ref: oh-mike-dsh
          persist-credentials: false

      - name: Run upstream sync
        uses: actions/github-script@v7
        with:
          script: |
            const { main } = await import('${{ github.workspace }}/.github/mike-upstream-sync/run.mjs')
            await main({ github, core })
