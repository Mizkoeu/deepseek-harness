# Daily/manual upstream-mirror maintenance for Mike's PUBLIC fork.
#
# This workflow mirrors the upstream default branch onto the fork's `master`
# and opens a single DRAFT pull request into `oh-mike-dsh` for HUMAN review. It
# NEVER merges, force-pushes, deploys, or writes upstream/settings/reviews. All
# policy lives in .github/mike-upstream-sync/sync.mjs (unit-tested).
#
# CI CANNOT VALIDATE THESE PRs AUTOMATICALLY. This repository's pull_request CI
# runs on team-only runners (`dsh-ubuntu-24-04-16core` and self-hosted pools)
# that do not exist on a personal fork, so bot PRs will not show green checks
# here. Review requires MANUAL local validation; the parent must also set up
# runners if fork CI is ever wanted. See the Agent Note
# 2026-09-09-mike-upstream-review-sync.md.
#
# GITHUB_TOKEN limits (current GitHub behavior, verified against
# https://docs.github.com/actions/using-workflows/triggering-a-workflow):
# a PR opened by GITHUB_TOKEN CAN trigger pull_request workflows, but such runs
# REQUIRE manual approval. Combined with the unavailable runners above, treat
# check status on these PRs as "not run" until a human validates locally. New
# fork Actions may also need to be enabled and allowed to create PRs; the parent
# configures that after publish. Scheduled runs can be delayed under load and
# GitHub disables schedules after ~60 days of repository inactivity.
#
# KNOWN LIMITATION — updating refs whose diff touches .github/workflows/**:
# GITHUB_TOKEN cannot create or update workflow files. When the upstream head
# this sync mirrors (or the reserved import branch it creates) differs from the
# fork in any .github/workflows/** file, the ref write is rejected server-side
# ("refusing to allow a GitHub App to create or update workflow ... without
# workflows permission"), and the `workflows` scope is NOT grantable to
# GITHUB_TOKEN by any permissions key. The mirror advance and import-branch
# creation therefore succeed only while upstream's workflow files are unchanged;
# a workflow-touching upstream update fails loud and needs a human (a manual
# push, or a PAT/GitHub App with `workflows` deliberately provisioned by the
# parent — NOT auto-copied here). This automation ships no such credential. See
# the Agent Note's auth-limitation section.
name: mike upstream review sync

on:
  schedule:
    # 05:17 UTC daily — an off-hour minute to avoid the top-of-hour surge.
    - cron: '17 5 * * *'
  workflow_dispatch:

# One queued run; do not cancel an in-progress mirror/PR operation midway.
concurrency:
  group: mike-upstream-review-sync
  cancel-in-progress: false

# Only the writes this automation needs on the fork: advance the mirror ref and
# open the draft PR. No other scope.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Never run on upstream or any other repository — only Mike's fork. The
    # comparison is case-insensitive because GitHub owner/repo slugs are.
    if: ${{ github.repository == 'MizkoEu/deepseek-harness' || github.repository == 'mizkoeu/deepseek-harness' }}
    runs-on: ubuntu-latest
    steps:
      # Check out the TRUSTED custom integration branch (oh-mike-dsh), NOT the
      # master mirror: the mirror holds upstream code and does NOT contain this
      # automation's .github/mike-upstream-sync/ scripts, so checking it out
      # would either module-not-found or, once the mirror advances, execute
      # upstream-controlled code with the write token. oh-mike-dsh is
      # human-reviewed and owns these scripts. Credentials are not persisted.
      - name: Checkout trusted integration branch
        uses: actions/checkout@v4
        with:
          ref: oh-mike-dsh
          persist-credentials: false

      - name: Run upstream sync
        uses: actions/github-script@v7
        with:
          script: |
            const { main } = await import('${{ github.workspace }}/.github/mike-upstream-sync/run.mjs')
            await main({ github, core })
